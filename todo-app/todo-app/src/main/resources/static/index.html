<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do App</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1f2430; --muted:#8a90a0; --accent:#3b6cf6; --danger:#e5484d; --border:#e4e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --text:#e8eaf0; --muted:#8a90a0; --accent:#6b8cff; --danger:#ff6b70; --border:#2a2e38; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:620px; margin:40px auto; padding:0 16px; }
  h1 { margin:0 0 20px; font-size:1.8rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  form { display:flex; flex-direction:column; gap:8px; }
  input[type=text], textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { resize:vertical; min-height:56px; }
  button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:9px 14px; }
  .primary { background:var(--accent); color:#fff; align-self:flex-end; }
  .filters { display:flex; gap:8px; margin-bottom:12px; }
  .filters button { background:transparent; color:var(--muted); border:1px solid var(--border); }
  .filters button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
  li:last-child { border-bottom:none; }
  li input[type=checkbox] { margin-top:4px; width:18px; height:18px; cursor:pointer; }
  .body { flex:1; min-width:0; }
  .title { font-weight:600; word-break:break-word; }
  .desc { color:var(--muted); font-size:.9rem; margin-top:2px; word-break:break-word; }
  li.done .title { text-decoration:line-through; color:var(--muted); }
  .del { background:transparent; color:var(--danger); padding:4px 8px; }
  .empty, .error { text-align:center; color:var(--muted); padding:20px 0; }
  .error { color:var(--danger); }
</style>
</head>
<body>
<main>
  <h1>✅ To-Do</h1>

  <div class="card">
    <form id="form">
      <input type="text" id="title" placeholder="What needs doing?" maxlength="200" required>
      <textarea id="description" placeholder="Details (optional)" maxlength="1000"></textarea>
      <button class="primary" type="submit">Add task</button>
    </form>
  </div>

  <div class="card">
    <div class="filters" id="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="active">Active</button>
      <button data-f="done">Done</button>
    </div>
    <ul id="list"></ul>
    <div id="msg"></div>
  </div>
</main>

<script>
const API = '/api/todos';
let todos = [];
let filter = 'all';

const list = document.getElementById('list');
const msg = document.getElementById('msg');

async function request(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) throw new Error('Request failed (' + res.status + ')');
  return res.status === 204 ? null : res.json();
}

async function load() {
  try {
    todos = await request(API);
    msg.className = ''; msg.textContent = '';
    render();
  } catch (e) {
    msg.className = 'error'; msg.textContent = e.message;
  }
}

function render() {
  const visible = todos
    .filter(t => filter === 'all' || (filter === 'done') === t.completed)
    .sort((a, b) => a.id - b.id);

  list.replaceChildren();
  if (!visible.length) {
    msg.className = 'empty'; msg.textContent = 'Nothing here yet.';
    return;
  }
  msg.className = ''; msg.textContent = '';

  for (const t of visible) {
    const li = document.createElement('li');
    if (t.completed) li.className = 'done';

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.completed;
    cb.onchange = () => act(() => request(`${API}/${t.id}/toggle`, { method: 'PATCH' }));

    const body = document.createElement('div');
    body.className = 'body';
    const title = document.createElement('div');
    title.className = 'title'; title.textContent = t.title;
    body.append(title);
    if (t.description) {
      const d = document.createElement('div');
      d.className = 'desc'; d.textContent = t.description;
      body.append(d);
    }

    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = 'Delete';
    del.onclick = () => act(() => request(`${API}/${t.id}`, { method: 'DELETE' }));

    li.append(cb, body, del);
    list.append(li);
  }
}

async function act(fn) {
  try { await fn(); await load(); }
  catch (e) { msg.className = 'error'; msg.textContent = e.message; }
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const title = document.getElementById('title');
  const description = document.getElementById('description');
  act(async () => {
    await request(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title.value.trim(), description: description.value.trim() })
    });
    title.value = ''; description.value = ''; title.focus();
  });
});

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('active', b === e.target));
  render();
});

load();
</script>
</body>
</html>
